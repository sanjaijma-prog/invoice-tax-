<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO Dashboard – Jai Maruthi Automation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1b1f2a;--mute:#5d6577;--line:#d9dde6;--bg:#f3f5f9;--acc:#8a1c2b;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0}
button,.btn{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.del{color:#b00020}
main{max-width:1000px;margin:20px auto;padding:0 16px}
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
table.list th,table.list td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.form{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px}
textarea{min-height:70px}
h3{margin:18px 0 8px;font-size:15px}
.items .row{display:grid;grid-template-columns:3fr 1fr 1fr auto;gap:8px;margin-bottom:6px}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hide{display:none!important}

/* ===== Printable sheet ===== */
.stage{padding:16px;overflow:auto}
.sheet{width:190mm;margin:0 auto;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:8.5pt;border:1px solid #000;box-sizing:border-box}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:2px 4px;vertical-align:top;word-wrap:break-word}
.sheet .nb{border:0}
.sheet .logo{text-align:center;padding:6px;border-bottom:2px solid #000}
.sheet .logo img{max-height:50px;max-width:60%}
.sheet .title{text-align:center;font-weight:700;font-size:11pt;text-decoration:underline;padding:4px;border-bottom:2px solid #000}
.sheet .r{text-align:right}
.sheet .c{text-align:center}
.sheet .b{font-weight:700}
.sheet .meta td{border:0;padding:1px 2px;font-size:8pt}
.sheet .tbl{margin:0}
.sheet .noleft{border-left:0}
.qr{width:70px;height:70px}
.qr img,.qr canvas{max-width:100%;height:auto}

@page{size:A4;margin:0}
@media print{
  html,body{margin:0!important;padding:0!important;background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top,main>*:not(#view-preview),.noprint{display:none!important}
  main{margin:0!important;padding:10mm!important;max-width:none!important}
  .stage{padding:0!important;overflow:visible!important}
  .sheet{width:100%!important;max-width:none;margin:0!important;overflow:visible!important;border:1px solid #000!important}
  .sheet tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <h1>PO Dashboard – Jai Maruthi Automation</h1>
  <div id="topbtns"></div>
</header>
<main>
  <section id="view-dash"></section>
  <section id="view-edit" class="hide"></section>
  <section id="view-preview" class="hide">
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:10px">
      <button onclick="go('dash')">← Dashboard</button>
      <button id="btnEdit">Edit</button>
      <button class="pri" onclick="window.print()">Print / Save PDF</button>
    </div>
    <div class="stage"><div class="sheet" id="sheet"></div></div>
  </section>
</main>

const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy=d=>d?d.split('-').reverse().join('-'):'';
function words(n){n=Math.round(n);if(!n)return'Zero';
 const a='One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen'.split(' ');
 const t='_ _ Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety'.split(' ');
 const two=x=>x<20?a[x-1]||'':t[Math.floor(x/10)]+(x%10?' '+a[x%10-1]:'');
 const three=x=>(x>=100?a[Math.floor(x/100)-1]+' Hundred'+(x%100?' ':''):'')+two(x%100);
 let s='';const cr=Math.floor(n/1e7),l=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,h=n%1000;
 if(cr)s+=two(cr)+' Crore ';if(l)s+=two(l)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(h)s+=three(h);
 return s.trim();}
function calc(p){const tv=p.items.reduce((s,i)=>s+(+i.q||0)*(+i.p||0),0);
 const c=tv*p.cgst/100,s=tv*p.sgst/100,g=tv*p.igst/100;return{tv,c,s,g,tot:tv+c+s+g}}

function go(v,id){['dash','edit','preview'].forEach(x=>$('#view-'+x).classList.toggle('hide',x!==v));
 $('#topbtns').innerHTML=v==='dash'?'<label class="btn" style="margin:0">Upload logo<input type="file" accept="image/*" id="logoIn" hidden></label> <button onclick="resetLogo()">Default logo</button> <button class="pri" onclick="newPO()">+ New PO</button>':'';
 if(v==='dash')dash();if(v==='edit')edit(id);if(v==='preview')preview(id);
 const li=$('#logoIn');if(li)li.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logo=r.result;save('po_logo',logo);alert('Logo saved')};r.readAsDataURL(f)};
 window.scrollTo(0,0)}

function dash(){const el=$('#view-dash');
 if(!db.length){el.innerHTML='<div class="empty">No purchase orders yet. Click “+ New PO” to create one.</div>';return}
 el.innerHTML='<table class="list"><tr><th>PO No</th><th>Date</th><th>Vendor</th><th>Total (INR)</th><th></th></tr>'+
 db.map(p=>`<tr><td>${esc(p.poNo)}</td><td>${dmy(p.poDate)}</td><td>${esc(p.vName)}</td><td>${fmt(calc(p).tot)}</td>
 <td style="white-space:nowrap"><button onclick="go('preview','${p.id}')">Preview</button> <button onclick="go('edit','${p.id}')">Edit</button> <button class="del" onclick="delPO('${p.id}')">Delete</button></td></tr>`).join('')+'</table>'}
function resetLogo(){logo=DEFAULT_LOGO;try{localStorage.removeItem('po_logo')}catch(e){}alert('Default logo set')}
function newPO(){const b=db[0]||{};const p={id:String(Date.now()),poNo:'',poDate:new Date().toISOString().slice(0,10),dueDate:'',qNo:'',qDate:'',vName:'',vAddr:'',vGst:'',dName:'',dAddr:'',dGst:'',
 bName:b.bName||'Jai Maruthi Automation',bAddr:b.bAddr||'',bGst:b.bGst||'',items:[{d:'',q:1,p:0}],cgst:9,sgst:9,igst:0,terms:b.terms||'',qrCompany:'',qrPoNo:'',qrPoDate:'',qrExpiry:'',qrSize:70,signFor:b.signFor||'',signLabel:b.signLabel||'Authorized Signatory',signImg:b.signImg||'',signH:b.signH||40};
 db.unshift(p);save('po_db',db);go('edit',p.id)}
function delPO(id){if(confirm('Delete this PO?')){db=db.filter(p=>p.id!==id);save('po_db',db);dash()}}

function edit(id){const p=db.find(x=>x.id===id);const el=$('#view-edit');
 if(p.signLabel===undefined)p.signLabel='Authorized Signatory';if(p.signFor===undefined)p.signFor='';if(p.signImg===undefined)p.signImg='';if(!p.signH)p.signH=40;
 const f=(k,l,t='text')=>`<div><label>${l}</label><input type="${t}" data-k="${k}" value="${esc(p[k])}"></div>`;
 const a=(k,l)=>`<div><label>${l}</label><textarea data-k="${k}">${esc(p[k])}</textarea></div>`;
 el.innerHTML=`<div class="form"><h3 style="margin-top:0">PO details</h3><div class="grid">${f('poNo','PO No')}${f('poDate','PO Date','date')}${f('dueDate','Due Date','date')}${f('qNo','Quotation No')}${f('qDate','Quotation Date','date')}</div>
 <h3>Vendor (M/S)</h3><div class="grid">${f('vName','Name')}${a('vAddr','Address')}${f('vGst','GSTIN')}</div>
 <h3>Billing to</h3><div class="grid">${f('bName','Name')}${a('bAddr','Address')}${f('bGst','GSTIN')}</div>
 <h3>Delivery to</h3><div class="grid">${f('dName','Name')}${a('dAddr','Address')}${f('dGst','GSTIN')}</div>
 <h3>Items</h3><div class="items" id="items"></div><button onclick="addItem('${id}')">+ Add item</button>
 <h3>Tax %</h3><div class="grid">${f('cgst','CGST %','number')}${f('sgst','SGST %','number')}${f('igst','IGST %','number')}</div>
 <h3>Terms & Conditions</h3>${a('terms','One per line')}
 <h3>QR code details (scan panna idhu mattum varum)</h3>
 <div class="grid">${f('qrCompany','Company name')}${f('qrPoNo','PO No')}${f('qrPoDate','PO Date')}${f('qrExpiry','Expiry Date')}${f('qrSize','QR size (px, default 70)','number')}</div>
 <div style="font-size:12px;color:var(--mute);margin-top:6px">Empty-a vittaa PO details-la irundhu auto-va edukkum. Maatha vendiyadhu mattum type pannunga.</div>
 <h3>Authorized Signature</h3>
 <div class="grid">${f('signFor','Company line (e.g. FOR JAI MARUTHI AUTOMATION)')}${f('signLabel','Signature label')}${f('signH','Signature image height (px, default 40)','number')}
 <div><label>Signature image (optional)</label><input type="file" accept="image/*" id="signIn"><div id="signPrev" style="margin-top:6px"></div><button type="button" class="del" style="margin-top:6px" onclick="clearSign('${id}')">Remove signature image</button></div></div>
 <div class="bar"><button class="pri" onclick="go('preview','${id}')">Save & Preview</button><button onclick="go('dash')">Back</button></div></div>`;
 el.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{p[i.dataset.k]=i.type==='number'?+i.value:i.value;save('po_db',db)});
 items(p);signPrev(p);
 $('#signIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=400,k=Math.min(1,m/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);p.signImg=c.toDataURL('image/png');save('po_db',db);signPrev(p)};im.src=r.result};r.readAsDataURL(f)}}
function signPrev(p){const e=$('#signPrev');if(e)e.innerHTML=p.signImg?`<img src="${p.signImg}" style="max-height:50px;max-width:160px;border:1px dashed var(--line)">`:'<span style="font-size:12px;color:var(--mute)">No image (blank space for hand signature)</span>'}
function clearSign(id){const p=db.find(x=>x.id===id);p.signImg='';save('po_db',db);signPrev(p);const i=$('#signIn');if(i)i.value=''}
function items(p){$('#items').innerHTML=p.items.map((it,n)=>`<div class="row"><input placeholder="Description" value="${esc(it.d)}" oninput="upd('${p.id}',${n},'d',this.value)">
 <input type="number" placeholder="Qty" value="${it.q}" oninput="upd('${p.id}',${n},'q',this.value)"><input type="number" placeholder="Price" value="${it.p}" oninput="upd('${p.id}',${n},'p',this.value)">
 <button class="del" onclick="rm('${p.id}',${n})">✕</button></div>`).join('')}
function upd(id,n,k,v){const p=db.find(x=>x.id===id);p.items[n][k]=k==='d'?v:+v;save('po_db',db)}
function addItem(id){const p=db.find(x=>x.id===id);p.items.push({d:'',q:1,p:0});save('po_db',db);items(p)}
function rm(id,n){const p=db.find(x=>x.id===id);p.items.splice(n,1);save('po_db',db);items(p)}

function preview(id){const p=db.find(x=>x.id===id);const c=calc(p),qs=+p.qrSize||70;$('#btnEdit').onclick=()=>go('edit',id);
 const rows=p.items.map((i,n)=>`<tr><td class="c">${n+1}</td><td>${esc(i.d)}</td><td class="r">${i.q}</td><td class="r">${i.p}</td><td class="r">${fmt(i.q*i.p)}</td></tr>`).join('');
 $('#sheet').innerHTML=`
 <div class="logo">${logo?`<img src="${logo}" alt="logo">`:'<b style="font-size:14pt">JAI MARUTHI AUTOMATION</b>'}</div>
 <div class="title">Purchase Order</div>
 <table><colgroup><col style="width:70%"><col style="width:30%"></colgroup>
 <tr><td style="border-left:0"><b>M/S</b><br>${esc(p.vName)}<br>${esc(p.vAddr).replace(/\n/g,'<br>')}<br>GSTIN: ${esc(p.vGst)}</td>
 <td style="border-right:0"><table class="meta"><colgroup><col style="width:42%"><col></colgroup>
 <tr><td class="b">PO No</td><td>: ${esc(p.poNo)}</td></tr><tr><td class="b">PO Date</td><td>: ${dmy(p.poDate)}</td></tr>
 <tr><td class="b">Due Date</td><td>: ${dmy(p.dueDate)}</td></tr><tr><td class="b">Quotation No</td><td>: ${esc(p.qNo)}</td></tr>
 <tr><td class="b">Quotation Date</td><td>: ${dmy(p.qDate)}</td></tr></table></td></tr>
 <tr><td style="border-left:0"><b>Billing To</b><br>${esc(p.bName)}<br>${esc(p.bAddr).replace(/\n/g,'<br>')}<br>GSTIN: ${esc(p.bGst)}</td>
 <td style="border-right:0"><b>Delivery to</b><br>${esc(p.dName)}<br>${esc(p.dAddr).replace(/\n/g,'<br>')}<br>GSTIN: ${esc(p.dGst)}</td></tr></table>
 <table><colgroup><col style="width:6%"><col style="width:54%"><col style="width:10%"><col style="width:12%"><col style="width:18%"></colgroup>
 <tr><th style="border-left:0">Sl</th><th>Description</th><th>Qty</th><th>Price</th><th style="border-right:0">Amount (INR)</th></tr>${rows}</table>
 <table><colgroup><col style="width:56%"><col style="width:26%"><col style="width:18%"></colgroup>
 <tr><td rowspan="5" style="border-left:0"><b>Amount in words:</b><br>Rupees ${words(c.tot)} Only</td>
  <td>Taxable Value</td><td class="r" style="border-right:0">${fmt(c.tv)}</td></tr>
 <tr><td>CGST @ ${p.cgst}%</td><td class="r" style="border-right:0">${fmt(c.c)}</td></tr>
 <tr><td>SGST @ ${p.sgst}%</td><td class="r" style="border-right:0">${fmt(c.s)}</td></tr>
 <tr><td>IGST @ ${p.igst}%</td><td class="r" style="border-right:0">${fmt(c.g)}</td></tr>
 <tr><td class="b">Total</td><td class="r b" style="border-right:0">${fmt(c.tot)}</td></tr></table>
 <table><colgroup><col style="width:70%"><col style="width:30%"></colgroup>
 <tr><td style="border-left:0;border-bottom:0;min-height:34mm;height:34mm"><b>Terms &amp; Conditions:</b><br>${esc(p.terms).replace(/\n/g,'<br>')}<div class="qr" id="qr1" style="margin-top:6px;width:${qs}px;height:${qs}px"></div></td>
 <td style="border-right:0;border-bottom:0;color:#2a4bd7;font-size:7.5pt"><div style="min-height:30mm;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center"><div style="font-weight:700">${esc(p.signFor||'')}</div>${p.signImg?`<img src="${p.signImg}" alt="signature" style="height:${+p.signH||40}px;max-width:90%;object-fit:contain">`:'<div></div>'}<div>${esc(p.signLabel===undefined?'Authorized Signatory':p.signLabel)}</div></div></td></tr></table>`;
 const mk=(sel,txt)=>{const e=$(sel);e.innerHTML='';if(window.QRCode)new QRCode(e,{text:txt,width:qs,height:qs})};
 mk('#qr1',`Company: ${p.qrCompany||p.bName}\nPO No: ${p.qrPoNo||p.poNo}\nPO Date: ${p.qrPoDate||dmy(p.poDate)}\nExpiry Date: ${p.qrExpiry||dmy(p.dueDate)}`);
}
go('dash');
</script>
</body>
</html>
